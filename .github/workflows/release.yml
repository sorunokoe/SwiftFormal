name: Release artifact
# Builds the prebuilt `swiftformal` artifact bundle (docs/RELEASING.md). It publishes nothing: the zip and its
# SHA-256 are kept as a workflow artifact. Run it from the Actions tab and pick the version tag in "Use workflow from".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifactbundle:
    if: github.actor == github.repository_owner && startsWith(github.ref, 'refs/tags/')
    # The pinned compiler (docs/guides/compilers.md): Xcode 27.0 on GitHub's `xcode-27` image, selected by path.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build the bundle
        # bash with pipefail: without it the step would take `tee`'s status and hide a failed check.
        shell: bash
        run: Scripts/release-artifactbundle.sh "$GITHUB_REF_NAME" dist | tee dist-build.txt
      # The claim users rely on: the same commit and compiler give the same bytes, wherever it is built.
      - name: Rebuild in another folder and compare
        run: |
          copy="$RUNNER_TEMP/swiftformal-copy"
          git worktree add --detach "$copy" HEAD
          (cd "$copy" && Scripts/release-artifactbundle.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/dist-copy")
          diff dist/swiftformal.artifactbundle.zip.sha256 "$RUNNER_TEMP/dist-copy/swiftformal.artifactbundle.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: swiftformal-artifactbundle-${{ github.ref_name }}
          path: |
            dist/swiftformal.artifactbundle.zip
            dist/swiftformal.artifactbundle.zip.sha256
            dist-build.txt
